{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход · Avtoraqam CRM</title>
  <link rel="stylesheet" href="{% static 'crm/login.css' %}">
  <link rel="stylesheet" href="{% static 'crm/login-center.css' %}?v=2">
</head>
<body>
<main class="login-page">
  <section class="login-brand"><img src="{% static 'img/avtoraqam_logo.png' %}" alt="Avtoraqam Samarkand"></section>
  <section class="login-panel">
    <form method="post" class="login-card">{% csrf_token %}
      <p class="eyebrow">Авторизация</p>
      <h2>Вход в систему</h2>
      <p class="subtitle">Введите данные своей учётной записи.</p>
      {% if form.errors %}<div class="login-error">Неверное имя пользователя или пароль.</div>{% endif %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label><span>Имя пользователя</span><input type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required placeholder="Введите логин"></label>
      <label><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required placeholder="Введите пароль"></label>
      <button type="submit">Войти в CRM <span>→</span></button>
      <small>Доступ разрешён только сотрудникам компании.</small>
    </form>
  </section>
</main>
</body>
</html>
